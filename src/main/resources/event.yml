# 史书模板：JSON 只保存事件类型、日期和参数，具体句子在查看或导出时生成。
# 占位符采用 %参数名%；条款中的 parameters 也可作为占位符使用。
day: "[%date%]"
unknown: "%nation%发生了事件：%event%。"
book:
  title: "%nation%的史书"
  author: "史官"
messages:
  help: "查阅国家史书、导出TXT或领取成书。"
  usage: "用法：/wde history <list|read|txt|book> [国家名或史书UUID] [页码/卷号]"
  denied: "你没有权限使用史书命令。"
  not_found: "未找到史书；已解散国家请使用史书UUID或包含存续日期的名称。"
  invalid_page: "页码或卷号无效。"
  page: "第 %page% / %pages% 页"
  exported: "史书TXT已生成。"
  book_given: "已获得史书第 %volume% / %volumes% 卷。"
  inventory_full: "背包没有空位，无法领取史书。"
  failure: "史书操作失败，请联系管理员查看日志。"
labels:
  DICTATORSHIP: "独裁制"
  DEMOCRACY: "民主制"
  NOBLE_COUNCIL: "贵族议会制"
  None: "无意识形态"
  CONQUEST: "征服"
  RECONQUEST: "收复失地"
  INDEPENDENCE: "独立"
  HOLY_WAR: "圣战"
  TRADE_CONFLICT: "贸易冲突"
  HUMILIATE_RIVAL: "羞辱宿敌"
  EXPORT_REVOLUTION: "输出革命"
  DESTROY_THREAT: "摧毁威胁"
  ATTACKER: "进攻方"
  DEFENDER: "防守方"
  BENEFICIARY: "获得让步"
  CONCEDING: "作出让步"
events:
  DIPLOMATIC_LETTER_INSULT: "于%date%，%sender%向%target%发表了一封言辞激烈的信。"
  DIPLOMATIC_LETTER_NOTICE: "于%date%，%sender%向%target%发表了一封正式的信。"
  DIPLOMATIC_LETTER_REQUEST: "于%date%，%sender%向%target%发表了一封充满恳切的信。"
  CHRONICLER_STARTED: "%nation%从此时开始有了史官。"
  NATION_CREATED: "%nation%于此日成立，首任国王为%leader%。"
  NATION_DISSOLVED: "%nation%于此日解散，史书自此封存。"
  NATION_RENAMED: "%before%更名为%after%。"
  GOVERNMENT_CHANGED: "%nation%的政体由%before%改为%after%。"
  LEADER_CHANGED: "%nation%的政府领袖由%before%变更为%after%。"
  KING_CHANGED: "%nation%的国王由%before%变更为%after%。"
  IDEOLOGY_CHANGED: "%nation%的国家意识形态由%before%改为%after%。"
  TOWN_JOINED: "城镇%town%加入%nation%。"
  TOWN_LEFT: "城镇%town%离开%nation%。"
  TOWN_RENAMED: "%nation%的城镇%before%更名为%after%。"
  SUBJECT_LIBERATED: "%nation%因%beneficiary%与%conceding%的和约获得解放。"
  WAR_DECLARED: "%nation%以%role%身份与%opponent%交战，战争理由为%reason%。"
  WAR_ENDED: "%attacker%与%defender%的战争结束，双方累计分数分别为%attackerScore%和%defenderScore%。"
  WAR_SETTLED: "%nation%与%opponent%达成和约，%nation%%outcome%。"
  WAR_DEFEAT: "%nation%向%opponent%作出战争让步，记为本次谈判的败方。"
  TREATY_FAILED: "%nation%与%opponent%的和约执行失败，已有变更以实际事件为准。"
  TREATY_CLAUSE_REPARATIONS_BENEFICIARY: "%nation%取得向%conceding%索要国库%percent%赔款的和约条款。"
  TREATY_CLAUSE_REPARATIONS_CONCEDING: "%nation%被迫接受向%beneficiary%赔付国库%percent%的和约条款。"
  TREATY_CLAUSE_FORCE_CONVERSION_BENEFICIARY: "%nation%迫使%conceding%采用本国意识形态。"
  TREATY_CLAUSE_FORCE_CONVERSION_CONCEDING: "%nation%被迫改信%beneficiary%的意识形态。"
  TREATY_CLAUSE_TRANSFER_TOWN_BENEFICIARY: "%nation%要求%conceding%将城镇%town%割让给%destinationNation%。"
  TREATY_CLAUSE_TRANSFER_TOWN_CONCEDING: "%nation%被迫将城镇%town%割让给%destinationNation%。"
  TREATY_CLAUSE_DISSOLVE_ALLIANCE_BENEFICIARY: "%nation%迫使%conceding%解散其主持的军事同盟。"
  TREATY_CLAUSE_DISSOLVE_ALLIANCE_CONCEDING: "%nation%被迫解散其主持的军事同盟。"
  TREATY_CLAUSE_EXPEL_FROM_ALLIANCE_BENEFICIARY: "%nation%迫使%conceding%退出其非主席国身份的集团。"
  TREATY_CLAUSE_EXPEL_FROM_ALLIANCE_CONCEDING: "%nation%被迫退出其非主席国身份的集团。"
  TREATY_CLAUSE_LIBERATE_SUBJECT_BENEFICIARY: "%nation%迫使%conceding%解放从属国%subjectNation%。"
  TREATY_CLAUSE_LIBERATE_SUBJECT_CONCEDING: "%nation%被迫解放从属国%subjectNation%。"
  TREATY_CLAUSE_UNCONDITIONAL_PASSAGE_BENEFICIARY: "%nation%取得通过%conceding%的无条件通行权。"
  TREATY_CLAUSE_UNCONDITIONAL_PASSAGE_CONCEDING: "%nation%被迫给予%beneficiary%无条件通行权。"
  TREATY_CLAUSE_HUMILIATE_BENEFICIARY: "%nation%羞辱了%conceding%。"
  TREATY_CLAUSE_HUMILIATE_CONCEDING: "%nation%遭到%beneficiary%的羞辱。"
  TREATY_CLAUSE_LOOT_CAPITAL_BENEFICIARY: "%nation%要求掠夺%conceding%的首都金库。"
  TREATY_CLAUSE_LOOT_CAPITAL_CONCEDING: "%nation%被迫接受首都金库遭掠夺的条款。"
  TREATY_CLAUSE_TRIBUTE_BENEFICIARY: "%nation%获得%conceding%的长期纳贡承诺。"
  TREATY_CLAUSE_TRIBUTE_CONCEDING: "%nation%被迫向%beneficiary%长期纳贡。"
  TREATY_CLAUSE_ALLOW_INDEPENDENCE_BENEFICIARY: "%nation%获准脱离%conceding%，成为独立政权。"
  TREATY_CLAUSE_ALLOW_INDEPENDENCE_CONCEDING: "%nation%承认%beneficiary%的独立。"
  TREATY_CLAUSE_FORCE_VASSALIZE_BENEFICIARY: "%nation%强制将%conceding%纳入其主权帝国，成为傀儡国。"
  TREATY_CLAUSE_FORCE_VASSALIZE_CONCEDING: "%nation%被迫成为%beneficiary%主权帝国的傀儡国。"
