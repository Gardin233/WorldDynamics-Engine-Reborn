# 战争模块配置。

reasons:
  reconquest:
    # 同一次连续持有时长必须严格超过此天数，短期反复占有不累计。
    minimumDays: 7
    # REAL_TIME 为现实天；REALISTIC_SEASONS 为季节日历天。
    # 未记录到兼容日历的持有区间按现实天回退；旧数据从升级后开始记录。
    clock: REAL_TIME
    world: world

warGoals:
  # 控制目标必须由进攻方在线人口严格超过此比例。
  controlThresholdPercent: 75.0
  # 目标条件连续维持超过此时长后，单独进攻方可强制兑现唯一对应的和约条款。
  holdSeconds: 1800
  # 战争目标条件采样间隔；占领条件失效时会重置连续计时。
  progressCheckSeconds: 5
  # 展现霸权：战败击杀数达到开战时防守阵营人口乘此倍率。
  dominancePopulationMultiplier: 1.0
  # 独立方作为防守方时，若进攻方未完成占领目标，防守方分差达到此值可强制要求独立。
  defenderIndependenceScoreDifference: 40.0
  # 强制兑现条款的预算成本；仍受 peaceTreaty.maxProposalPoints 限制。
  clauses:
    forceDemocracyPoints: 60
    dissolveThreatOrganizationPoints: 70
  # 强制民主化后锁定目标国政体的时长。
  regimeLock:
    durationDays: 100
    # REAL_TIME 使用现实天；REALISTIC_SEASONS 使用季节日历天。
    clock: REAL_TIME
    world: world

peaceTreaty:
  # 单份和平条约中可消耗的总分数上限。
  maxProposalPoints: 100
  clauses:
    reparations:
      # 索要赔款时，每 1% 国库赔款所需的分数。
      pointsPerPercent: 1
      # 索要赔款的最高比例。
      maxPercent: 20
    forceConversionPoints: 15
    transferTownPoints: 20
    dissolveAlliancePoints: 30
    expelFromAlliancePoints: 15
    liberateSubjectPoints: 25
    unconditionalPassagePoints: 10
    humiliatePoints: 5
    lootCapitalPoints: 20
    tributePoints: 25
    # 强制让步国成为受益国所主持主权帝国的傀儡国。
    forceVassalizePoints: 70
    allowIndependencePoints: 40
scoring:
  # 所有 WDER 战争统一周期，单位秒。每周期累加，不覆盖先前分数。
  cycleSeconds: 300
  # 所有战争有效击杀的分数，双方相同。
  killPoints: 1.0
  # 仅防守方复活后冻结，期间不计入占领人数。进攻方不冻结。
  defenderRespawnLockSeconds: 30
  # 每个国家原始占领权重固定50：多城首都25，其余25按非首都人口分配。
  # 单城国家或独立城镇权重50。全面和约按阵营参战国家数归一化为50。
  # 单独谋和保留针对对方国家的原始占领分与击杀分，不借用其他国家领土分。
  # 防守领土按进攻人数/双方人数分给进攻方，余数给防守方；无人时防守方得全额。
  # 进攻方本土不提供进攻方占领分；防守方反攻按敌方城镇权重和人数比例获得额外分。

truce:
  # 和平条约或单独谋和生效后，至少持续多久的停战期（小时）。
  baseHours: 24
  # 在保底时间之外，按条约分数百分比最多额外增加多少小时停战期。
  maxAdditionalHours: 168
  realisticSeasons:
    # 开启后，新停战期优先按指定世界的 RealisticSeasons 日期计算。
    enabled: false
    # 所有国家统一采用此世界日期，与参战玩家所在世界无关。
    world: world
    # 保底停战期（日历天），加上额外天数乘以条约分数百分比，向上取整。
    baseDays: 1
    maxAdditionalDays: 7
    # 依赖、世界或日历不可用时，按上方现实小时配置计时。
    # 已有日历停战期保留创建时的世界及日历截止点；读取失败使用其现实时间备用截止点。
