# 是否启用角色背景机制。
enabled: true

# 是否要求玩家首次进入服务器后，必须先完成儿童时期和成年时期的背景及技能加点才能正常移动。
forceSelectionOnFirstJoin: false

# 用户提交的故事标题和正文会过滤这些敏感词；管理者可按服务器规则调整列表。
content-filter:
  enabled: true
  blocked-words:
    - "女权"
    - "男权"
    - "性别对立"
    - "纳粹"
    - "皇汉"
    - "傻逼"
    - "他妈的"
    - "操你妈"
    - "fuck"
    - "shit"
    - "bitch"

# 每个阶段选一个背景；每个背景的 skillPoints 总和必须恰好为 5。
stages:
  childhood:
    backgrounds:
      farm_child:
        title: "农家孩子"
        lore:
          - "%player_name%从小在田埂与作物之间长大，对土地与耕作十分熟悉。"
        skillPoints:
          "auraskills/farming": 5
      mine_child:
        title: "矿镇少年"
        lore:
          - "%player_name%在矿道边缘长大，儿时便熟悉石头、矿脉与洞穴。"
        skillPoints:
          "auraskills/mining": 5
      river_child:
        title: "河湾渔童"
        lore:
          - "%player_name%在河湾边长大，抛竿、收线与辨认鱼群是日常。"
        skillPoints:
          "auraskills/fishing": 5

  adulthood:
    backgrounds:
      frontier_farmer:
        title: "边境垦殖者"
        lore:
          - "%player_name%选择在边境开垦荒地，劳作与野外采集都磨练得十分扎实。"
        skillPoints:
          "auraskills/farming": 3
          "auraskills/foraging": 2
      militia_veteran:
        title: "民兵老兵"
        lore:
          - "%player_name%曾在地方民兵中服役，在战斗与防守训练中积累经验。"
        skillPoints:
          "auraskills/fighting": 3
          "auraskills/defense": 2
      guild_craftsman:
        title: "行会匠人"
        lore:
          - "%player_name%从行会学徒一步步成长，既善于采掘材料，也熟悉炼制工艺。"
        skillPoints:
          "auraskills/excavation": 3
          "auraskills/alchemy": 2
