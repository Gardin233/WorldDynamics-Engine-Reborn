# 戒律注册表。
# 说明：
# 1. 旧版战争戒律使用 namespace:wde/xxx
# 2. 新增默认戒律使用 namespace:wder/xxx
# 3. 若 attitudes 中使用的是局部 id（如 neutral、hate、want），程序会自动拼接为完整 id
# 4. 可选字段 icon 使用原版物品名称或 CraftEngine 物品 ID，直接定义该戒律在 GUI 中的图标
# 5. 优先使用已有的中立态度；没有中立项的极端戒律优先采用已有的反对态度，不新增态度。
#    第一项按此规则排列；旧配置即使保留原顺序，新建文化也使用同一默认选择规则。
# 6. meme.cant_use 会禁止选择指定态度；多个已选模因的禁用项会合并。
#    default 只作为新建或当前态度失效时的优先回退态度，不会覆盖仍合法的旧选择。
# 7. 戒律态度根据玩家行为调整心情，不直接赋予药水效果。
# 8. 删除某个定义会停用对应选项；重载时不会自动补回，已保存的态度会保留但不生效。
# 9. 可选 moodWeight 为 0～10；越极端的态度可设置越高，缺省为 1。
# 10. 每个态度均显式设置 moodChange.compliant / violation（遵守加成 / 违背扣减）；
#     中立、无态度、无、无规则为 0/0，其他态度为 1/1，最终数值再乘 moodWeight。
#     只有已接入游戏行为的戒律才会实际结算；态度显式数值优先于 mood.changes 和 mood.instantActions。
doctrines:
  registry:
    "namespace:wde/war":
      title: "战争"
      color: "&6"
      lore: "对于国家之间战争的渴望"
