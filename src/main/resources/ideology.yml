              compliant: 0
              violation: 0
            lore: "战争作为政治上的最后手段，我们不会滥用也不会放弃"
        - hate:
            title: "厌恶"
            color: "&4"
            moodChange:
              compliant: 1
              violation: 1
            lore: "除了毫无意义的牺牲，战争还能带来什么?"
        - want:
