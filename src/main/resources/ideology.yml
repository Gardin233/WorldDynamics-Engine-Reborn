# 文化相关配置。

# 是否启用文化展示相关功能。
religionEnabled: true

# 文化与教会史书；新安装默认开启，旧配置缺少此项时补全为关闭。
# REAL_TIME 使用现实日期；REALISTIC_SEASONS 使用下方 world 对应的季节日历。
history:
  enabled: true
  clock: REAL_TIME
  world: world

# 模因与戒律修改冷却。
# mode: REAL_TIME 使用现实天；REALISTIC_SEASONS 使用 RealisticSeasons 日历天。
# 若选择 REALISTIC_SEASONS 但插件/世界/日历不可用，会自动回退为现实天。
cooldowns:
  mode: REAL_TIME
  world: world
  memes:
    days: 7
  doctrines:
    days: 7

# 文化治理模式与枢机选举。
# 模式状态保存在每个文化数据中；此默认值只用于新建组织和旧版配置补齐。
governance:
  defaultMode: LIFETIME

# 枢机席位公式：min(maximumSeats, baseSeats + floor((追随者人数 - 1) / followersPerAdditionalSeat))。
cardinals:
  baseSeats: 2
  followersPerAdditionalSeat: 25
  maximumSeats: 9

# 枢机选举。选民为投票开始和计票时仍是该文化追随者的现任枢机。
# 候选人为未被制裁的现任追随者，个人选票只保存在文化数据中，不公开展示。
elections:
  intervalDays: 90
  votingDays: 7
  # REAL_TIME 或 REALISTIC_SEASONS；日历不可用时回退至现实时间。
  clock: REAL_TIME
  world: world
  # 法定人数按投票期间有资格的枢机人数计算，弃权计入法定人数。
  quorumRatio: 0.5
  # 获胜者需获得有效非弃权选票的最低比例。
  winnerMinimumRatio: 0.5
  # ALL_FOLLOWERS 或 CARDINALS_ONLY；候选人仍须是有效追随者。
  candidateScope: ALL_FOLLOWERS
  # 缺席默认不计入法定人数；弃权默认计入法定人数但不参与候选人票数。
  absenceCountsTowardQuorum: false
  abstentionCountsTowardQuorum: true
  # 每位有效枢机一票，不按职位或城镇人口加权。
  votingRule: ONE_CARDINAL_ONE_VOTE
  # 平票时保留现任领袖；另一选项 NO_WINNER 表示本轮不更换。
  tiePolicy: KEEP_INCUMBENT
  # RETRY_AFTER_DAYS：保留现任领袖并按 noWinnerRetryDays 重试；KEEP_INCUMBENT：保留并按正常周期重试。
  noWinnerPolicy: RETRY_AFTER_DAYS
  noWinnerRetryDays: 30

# 共议制教会规则。居民同时只能加入同一源文化下的一座活跃教会。
churches:
  maximumPerIdeology: 32
  membershipCooldownHours: 24
  governanceActionCooldownHours: 24

# 神圣大会议案由所有未受制裁的活跃教会首脑投票。
# MEMBERS 按当前有效成员数加权，EQUAL_CHURCHES 为每个教会一票；赞成权重必须严格超过比例门槛。
council:
  proposalDurationDays: 7
  proposalCooldownHours: 12
  voteWeighting: MEMBERS
  maximumChurchWeight: 10000
  quorumRatio: 0.5
  approvalRatio: 0.5
  sanctionMaximumDays: 90

# 文化仪式系统。
# 仪式定义由文化最高统治机构创建；终身制/枢机制扣教廷金库，共议制按活跃教会金库占比分摊。
rituals:
  creationCost: "10000.00"
  durationSeconds: 900
  rangeBlocks: 48.0
  weights:
    follower: 0.02
    cardinal: 0.05
    ideologyLeader: 0.20
    synodalChurchHead: 0.20

# 进食与动物击杀的心情变化按戒律态度权重累加，默认 30 分钟后消散。
# 护甲戒律是长期状态修正，无限时；只在装备、信仰或态度相关事件时重新计算。
mood:
  decayMinutes: 30
  # 玩家死亡获得的重获新生加成，以及同镇成员死亡、改信背叛和击杀叛徒的临时心情变化。
  events:
    deathRebirthBonus: 10
    townDeathPenalty: -4
    betrayalPenalty: -4
    betrayerHuntBonus: 10
  # 新玩家按累计在线时长逐档减少心情期望加成；每档默认 2 小时。
  # moodBonuses 顺序对应：极低期望、很低期望、低期望、合理期望、高期望、很高期望。
  expectations:
    newPlayer:
      stepHours: 2
      moodBonuses: [30, 24, 18, 12, 6, 0]
    # 镇长与国王身份修正不叠加；同时具备时国王修正优先。/wde mood 会分项显示配置值及实际应用值。
    roles:
      townMayor: -8
      nationKing: -12
  # 心情高于 50 时，每到间隔从玩家当前可用的已启用灵感中随机选择。
  inspiration:
    intervalMinutes: 2
    effects:
      arrowArmorPiercing:
        enabled: true
      meleeArmorPiercing:
        enabled: true
      animalTaming:
        enabled: true
      nightingale:
        enabled: true
        durationMinutes: 15
      consolation:
        enabled: true
        moodBonus: 10
      actionIncentive:
        enabled: true
        durationMinutes: 15
      miningIncentive:
        enabled: true
        durationMinutes: 15
      stretch:
        enabled: true
        durationMinutes: 15
  changes:
    # attitude 未设置 moodChange 时使用此遵守增益/违背扣减基数。
    compliant: 1
    violation: 1
  # 瞬时行为独立调整基础平复值，仍乘以相关戒律态度的 moodWeight。
  instantActions:
    animalKilling:
      compliant: 1
      violation: 1
    humanMeat:
      compliant: 1
      violation: 1
  doctrineActions:
    animalKilling:
      enabled: true
    animalResonance:
      enabled: true
    animalPersonhoodLeash:
      enabled: true
      # 仅动物平权模因持有者生效；每只动物进入观察范围时只扣减一次。
      radiusBlocks: 8
      checkIntervalTicks: 40
      moodPenalty: 5
      moodBonus: 5
      moodDurationMinutes: 5
    rituals:
      enabled: true
      satisfactionDurationMinutes: 30
      # “推崇”态度连续这么多现实日未参与仪式后，维护长期心情扣减。
      longAbsenceDays: 30
    war:
      enabled: true
      # 持续和平达到该现实天数后，按战争戒律态度维护和平心情修正。
      longPeaceDays: 30
    raiding:
      enabled: true
      # 距离上次有效经济战争达到该现实天数后，掠袭态度产生和平期心情修正。
      longPeaceDays: 30
    bonding:
      enabled: true
      moodPerTamedAnimal: 2
      petDeathPenalty: 4
      petDeathDurationDays: 7
    comfort:
      enabled: true
      # 连续累计在线游戏时间达到该 Minecraft 天数未睡时，获得态度符合加成。
      noSleepThresholdDays: 3
    roughingIt:
      enabled: true
    pain:
      enabled: true
      checkIntervalTicks: 20
      # 低于对应血量比例时采用最深一档，不叠加多个档位。
      healthThresholds: [0.75, 0.50, 0.25, 0.10]
      ideal:
        highHealthPenalty: 2
        lowHealthBonuses: [2, 4, 6, 10]
      none:
        lowHealthPenalties: [2, 4, 6, 10]
    lighting:
      enabled: true
      checkIntervalTicks: 20
      # 白天取 block/sky 光照较大值；夜晚只用 block 光照。固定判定阈值为 7。
    indoors:
      enabled: true
      checkIntervalTicks: 20
      # 脚下方块天空光小于 10 判定为室内；10 及以上判定为室外。
    mining:
      enabled: true
      # 破坏下列原版矿石时触发采矿戒律。
      ores:
        vanilla:
          - COAL_ORE
          - DEEPSLATE_COAL_ORE
          - IRON_ORE
          - DEEPSLATE_IRON_ORE
          - COPPER_ORE
          - DEEPSLATE_COPPER_ORE
          - GOLD_ORE
          - DEEPSLATE_GOLD_ORE
          - NETHER_GOLD_ORE
          - REDSTONE_ORE
          - DEEPSLATE_REDSTONE_ORE
          - LAPIS_ORE
          - DEEPSLATE_LAPIS_ORE
          - DIAMOND_ORE
          - DEEPSLATE_DIAMOND_ORE
          - EMERALD_ORE
          - DEEPSLATE_EMERALD_ORE
          - NETHER_QUARTZ_ORE
          - ANCIENT_DEBRIS
        # 填写 CraftEngine 自定义方块的完整 ID，例如 "ores:ruby_ore"。
        craftengine: []
    logging:
      enabled: true
      # 仅统计原木/树干方块，不包含木板及完整木方块。
      wood:
        vanilla:
          - OAK_LOG
          - STRIPPED_OAK_LOG
          - SPRUCE_LOG
          - STRIPPED_SPRUCE_LOG
          - BIRCH_LOG
          - STRIPPED_BIRCH_LOG
          - JUNGLE_LOG
          - STRIPPED_JUNGLE_LOG
          - ACACIA_LOG
          - STRIPPED_ACACIA_LOG
          - DARK_OAK_LOG
          - STRIPPED_DARK_OAK_LOG
          - MANGROVE_LOG
          - STRIPPED_MANGROVE_LOG
          - CHERRY_LOG
          - STRIPPED_CHERRY_LOG
          - PALE_OAK_LOG
          - STRIPPED_PALE_OAK_LOG
          - CRIMSON_STEM
          - STRIPPED_CRIMSON_STEM
          - WARPED_STEM
          - STRIPPED_WARPED_STEM
        # 填写 CraftEngine 自定义木头方块的完整 ID，例如 "woods:ancient_log"。
        craftengine: []
    trees:
      enabled: true
      # 玩家成功放置下列树苗时按“树”戒律结算。
      saplings:
        vanilla:
          - OAK_SAPLING
          - SPRUCE_SAPLING
          - BIRCH_SAPLING
          - JUNGLE_SAPLING
          - ACACIA_SAPLING
          - DARK_OAK_SAPLING
          - MANGROVE_PROPAGULE
          - CHERRY_SAPLING
          - PALE_OAK_SAPLING
          - AZALEA
          - FLOWERING_AZALEA
        # 填写 CraftEngine 树苗物品 ID 或放置后方块 ID，例如 "trees:ancient_sapling"。
        craftengine: []
    potions:
      enabled: true
      # 在指定药水物品列表中命中时，为“医疗或社交”和“必须”态度添加额外奖励。
      inebriationMoodBonus: 10
      # 此列表只声明哪些 CE 物品按药水戒律处理，不代表负面效果，例如 "alchemy:healing_tonic"。
      craftenginePotionItems: []
      # “醉生梦死”药水名单：原版使用 PotionType 名称，CE 使用物品完整 ID。
      inebriationPotions:
        vanilla:
          - POISON
          - LONG_POISON
          - STRONG_POISON
          - HARMING
          - STRONG_HARMING
          - WEAKNESS
          - LONG_WEAKNESS
          - SLOWNESS
          - LONG_SLOWNESS
          - STRONG_SLOWNESS
          - TURTLE_MASTER
          - LONG_TURTLE_MASTER
          - STRONG_TURTLE_MASTER
          - INFESTED
          - OOZING
          - WEAVING
          - WIND_CHARGED
        craftengine: []
    displayOfHeads:
      enabled: true
      checkIntervalTicks: 40
      radiusBlocks: 8
    fieldBattle:
      enabled: true
      combatTimeoutSeconds: 30
    proselytizing:
      enabled: true
    kindness:
      enabled: true
      # 同一赠与者向同一受赠者重复赠与时，仁善加成的最短间隔。
      giftMoodCooldownMinutes: 30
      # 同一对玩家拒绝施舍后，仁善违背扣减的冷却时长。
      refusalMoodCooldownHours: 24
    ranching:
      enabled: true
    multiculturalism:
      enabled: true
      checkIntervalTicks: 100
  collapse:
    # 剩余心情 34～49 为轻度，17～33 为中度，0～16 为重度。
    severity:
      mildMinimumMood: 34
      moderateMinimumMood: 17
    effects:
      sadWander:
        enabled: true
        durationSeconds: 300
        # 每 tick 的水平行走速度（方块/tick）与随机目的地最大距离（方块）。
        walkSpeed: 0.11
        wanderRadius: 6.0
      darkVision:
        enabled: true
        durationSeconds: 180
        # 失明期间循环播放恶魂环境音；音量范围 0～4，音高范围 0.5～2。
        soundIntervalTicks: 80
        soundVolume: 1.0
        soundPitch: 0.8
      crazyTalk:
        enabled: true
        durationSeconds: 180
        # 发言间隔及候选语句；以发病玩家身份发送。
        intervalSeconds: 15
        messages:
          - "我听见有人在呼唤我。"
          - "我的日子好像永远都是那么糟糕"
          - "为什么要让我过这样的生活"
          - "不要不要不要不要不要不要不要"
          - "我活的好苦。。。"
          - "我恨这个世界"
          - "好烦好烦好烦好烦好烦好烦好烦"
          - "我做错了好多事，我是一个罪人"
          - "我绝对不可救药，不可饶恕了"
          - "谁也不要管我!谁也不要烦我!"
          - "讨厌讨厌讨厌讨厌讨厌"
          - "我想要休息，我想要喘口气.."
          - "世界对我不公!"
      catatonicStupor:
        enabled: true
        durationSeconds: 120
      faithCrisis:
        enabled: true
        durationSeconds: 120
      selfHarm:
        enabled: true
        durationSeconds: 5
      wildOutburst:
        enabled: true
        # 24 小时作为存档续期周期；背包未清空时效果会自动续期。
        durationSeconds: 86400
        dropIntervalTicks: 10
      humanityCollapse:
        # 个人“非人化”戒律选为 required 时自动崩溃固定触发此流程。
        enabled: true
        durationSeconds: 180
        titleFadeInTicks: 5
        titleStayTicks: 40
        titleFadeOutTicks: 10
        # delaySeconds 为崩溃开始后的延迟；标题、副标题和聊天内容均支持 %player_name% 与颜色码。
        sequence:
          - delaySeconds: 2
            title: "&5人性崩溃"
            subtitle: "&7你开始失去对自我的认同。"
            chat: "&7你是谁，已经不再重要。"
          - delaySeconds: 7
            title: "&d剥离旧我"
            subtitle: "&7曾经定义你的规则正在消散。"
            chat: "&d旧有的人性已经无法约束你。"
          - delaySeconds: 13
            title: "&5非人化"
            subtitle: "&7你终于超越了人类身份。"
            chat: "&5从现在起，你不再属于人类。"
    # 崩溃结束后获得的“得到宣泄”临时心情加成。
    release:
      moodBonus: 40
      durationMinutes: 30

economy:
  # 教廷单向金库：任何玩家可献金，所有玩家（包括领袖）均不能取款。
  # 金库以 config.yml 第一项默认货币记账，献金使用默认货币。
  treasury:
    enabled: true
    # 每个 Towny 新日结算一次。终身制/枢机制面向该信仰全体个人追随者；共议制仅向当前教会成员征收。
    # 定额什一税优先使用默认货币，不足时按汇率折算其他已配置货币。
    # 余额不足仅收现有资金，不记欠税；没有个人信仰或未加入共议教会的玩家不征收。
    titheEnabled: true
    # 所有什一税余额查询和扣款使用该世界；需填写已加载的世界，离线玩家也使用它。
    # 在按世界分账的经济插件中，仅计算此世界的余额，避免跨世界重复计入。
    taxWorld: world
    # 旧宗教升级后金库余额为 0、税额为 0，不会自动开启扣费，需由领袖设置。
    # 每个宗教的领袖可设置每日固定金额，额度为 0 时停征。
    defaultTitheAmount: "0"
    logPartialCollection: true
  # 枢机任免费用以教廷金库默认货币结算，只有成功写入任免状态后才扣款。
  # 金库仍无玩家提款入口；这些治理费用是唯一允许的内部支出。
  governance:
    appointCardinalCost: "500.00"
    revokeCardinalCost: "250.00"
    # 新建教会的费用从发起人钱包按指定币种扣除。
    churchCreation:
      amount: "5000.00"
      currency: USD
  charges:
    # 创建文化时的费用。
    religionCreation:
      amount: "5000.00"
      currency: USD
    # 玩家首次选择文化免费；若之后再次选择其他文化，则按此费用扣除玩家个人资金。
    religionPlayerConversion:
      amount: "3000.00"
      currency: USD
    # 城镇首次选择文化免费；若之后再次选择其他文化，则按此费用从城镇金库扣除。
    # 注意：Towny 金库本质上仍使用默认货币。若这里填写了非默认货币，程序会先按汇率换算为默认货币后再扣除。
    religionTownConversion:
      amount: "2000.00"
      currency: USD
    # 国家首次选择文化免费；若之后再次选择其他文化，则按此费用从国家国库扣除。
    # 注意：Towny 国库本质上仍使用默认货币。若这里填写了非默认货币，程序会先按汇率换算为默认货币后再扣除。
    religionNationConversion:
      amount: "3000.00"
      currency: USD
    # 镇长/城镇领袖强迫本镇居民改信时的费用，从城镇金库扣除。
    religionForcedPlayerConversion:
      amount: "5000.00"
      currency: USD
    # 国家强迫下属城镇改宗时的费用，从国家国库扣除。
    religionForcedTownConversion:
      amount: "2000.00"
      currency: USD

# 模因注册表。
# 用途：
# 1. 这里只负责注册“可识别的模因定义”，用于文化模因系统。
# 2. 模因可定义心情区间及灵感/崩溃结果效果 ID；自然至上提供 animal_taming，黑暗亲和提供 nightingale，传教热忱提供 consolation，裸体主义提供 action_incentive，地底之心提供 mining_incentive，仪式热忱提供 dark_vision，苦痛美德提供 self_harm 和 stretch。
# 3. 每条模因至少需要 id、title 和 description。
# 4. 可选字段 icon 使用原版物品名称或 CraftEngine 物品 ID，直接定义该模因在 GUI 中的图标。
# 5. 可选字段 exclusive_with 用于声明互斥模因；只需一侧声明即可双向生效。
# 6. 其他插件可监听 WDER 提供的模因注册事件，在运行时追加新的模因定义。
# 7. 后续为某个文化分配模因时，建议直接保存 meme id，而不是标题文本。
# 8. 删除某个定义会停用对应选项；重载时不会自动补回，玩家已保存的选择会保留但不生效。
# 9. 每个模因可选配置 moodEffects.ranges、moodEffects.collapse 和 moodEffects.inspiration。
#    collapse 与 inspiration 均使用 YAML 列表，可在同一模因下配置多个 effect_id。
#    collapse 可填 sad_wander、dark_vision、crazy_talk、catatonic_stupor、faith_crisis、self_harm、wild_outburst 限制崩溃效果池；
#    当前选择的模因都未填写时，从该崩溃等级的全部启用效果中随机。
#    ranges 项格式为 {min: 0, max: 24, effects: [effect_id]}，心情上下限均包含。
memes:
  registry:
    original_sin:
      title: "原罪主义"
      color: "&5"
      description: "我们生来有罪。其他人比我们更有价值。"
      icon: SOUL_LANTERN
    nature_primacy:
      title: "自然至上"
      color: "&2"
      description: "人类是完美大自然中的污点。"
      icon: OAK_SAPLING
      moodEffects:
        inspiration:
          - animal_taming
    proselytizer:
      title: "传教热忱"
      color: "&6"
      description: "我们的使命是传播信仰。"
      icon: BELL
      moodEffects:
        inspiration:
          - consolation
    loyalty:
      title: "赤胆忠心"
      color: "&9"
      description: "我们在面对其他人时必须站在自己人的立场上。"
    supremacist:
      title: "霸权主义"
      color: "&4"
      description: "我们的人民应该主宰其他所有人。"
    collectivist:
      title: "集体主义"
      color: "&3"
      description: "每个人都是集体的一部分。人们应该努力发挥自己的作用为集体做贡献。"
      exclusive_with:
        - individualist
    ritualist:
      title: "仪式热忱"
      color: "&d"
      description: "宇宙尚有广大潜能。借助仪式，我们方能对它有所了解，进而驾驭其中的力量。"
      moodEffects:
        collapse:
          - dark_vision
