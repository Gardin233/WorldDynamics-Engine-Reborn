ideology_meme_original_sin_name: 'Pecado Original'
ideology_meme_original_sin_description: 'Se considera que la naturaleza humana es defectuosa por sí misma, y que el deseo debe ser contenido mediante disciplina, arrepentimiento y orden.'
ideology_meme_nature_primacy_name: 'Primacía de la Naturaleza'
ideology_meme_nature_primacy_description: 'La civilización no debe colocarse por encima de la naturaleza; cuanto más cerca se viva del instinto, la estación y lo salvaje, más auténtica será la vida.'
ideology_meme_proselytizer_name: 'Fervor Misionero'
ideology_meme_proselytizer_description: 'La creencia propia debe expandirse hacia afuera. Convencer a otros y agrandar la comunidad se trata como un deber casi sagrado.'
ideology_meme_loyalty_name: 'Lealtad'
ideology_meme_loyalty_description: 'La lealtad es la virtud suprema, y la traición se considera peor que la derrota.'
ideology_meme_supremacist_name: 'Supremacismo'
ideology_meme_supremacist_description: 'Se cree que los fuertes tienen derecho a dominar a los débiles, y que la conquista es una forma legítima de imponer orden.'
ideology_meme_collectivist_name: 'Colectivismo'
ideology_meme_collectivist_description: 'El individuo es solo una parte del conjunto, y el trabajo, los recursos y el honor deben servir antes que nada a la supervivencia colectiva.'
ideology_meme_ritualist_name: 'Ritualismo'
ideology_meme_ritualist_description: 'La ceremonia repetida y solemne moldea identidad y convicción, por lo que el ritual público se vuelve esencial para la comunidad.'
ideology_meme_darkness_name: 'Afinidad con la Oscuridad'
ideology_meme_darkness_description: 'La oscuridad no se entiende como miedo, sino como refugio, comodidad y un entorno adecuado para la vida.'
ideology_meme_tunneler_name: 'Corazón Subterráneo'
ideology_meme_tunneler_description: 'La vida subterránea se valora por su seguridad y permanencia, y la profundidad de la roca se prefiere a la exposición de la superficie.'
ideology_meme_cannibal_name: 'Canibalismo'
ideology_meme_cannibal_description: 'Consumir carne humana se interpreta como parte del poder, la victoria o el ritual, rompiendo deliberadamente los tabúes morales comunes.'
ideology_meme_bloodfeeder_name: 'Fervor Sanguíneo'
ideology_meme_bloodfeeder_description: 'La sangre se venera como símbolo de vida y poder, y los ritos de sangre se practican con intensidad casi sagrada.'
ideology_meme_pain_is_virtue_name: 'El Dolor Es Virtud'
ideology_meme_pain_is_virtue_description: 'Se cree que el dolor refina la voluntad, y soportar el sufrimiento se considera prueba de valor y fortaleza.'
ideology_meme_nudist_name: 'Nudismo'
ideology_meme_nudist_description: 'El cuerpo no debe ocultarse por vergüenza; la ropa se ve como restricción y disfraz más que como necesidad.'
ideology_meme_nonhuman_alienation_name: 'Alienación No Humana'
ideology_meme_nonhuman_alienation_description: 'La identidad humana tradicional se rechaza en favor de la mutación, la mecanización y la transformación en algo radicalmente distinto.'
ideology_meme_raider_name: 'Rapiña'
ideology_meme_raider_description: 'El saqueo y la incursión se aceptan como caminos naturales hacia la supervivencia, la riqueza y el prestigio.'
ideology_meme_individualist_name: 'Individualismo'
ideology_meme_individualist_description: 'La elección personal y los límites privados están por encima de la exigencia colectiva, y ningún grupo debe absorber por completo al individuo.'
help_cmd_org_mobilizewar: 'Obliga a una nación súbdita regular a participar en la guerra actual del imperio soberano.'
ideology_meme_animal_personhood_name: 'Derechos Animales'
ideology_meme_animal_personhood_description: 'Los animales no son simples herramientas o recursos, sino seres vivos merecedores de una consideración moral más cercana a la de los humanos.'
ideology_meme_human_primacy_name: 'Primacía Humana'
ideology_meme_human_primacy_description: 'La humanidad es el centro moral del universo.'
