      - keyword: voidStrange
        weight:
        zh: 残缺的
      - keyword: voidStrange
        weight:
        zh: 非人类
      - keyword: voidStrange
        weight:
        zh: 离奇的
      voidVerbphrase:
      - keyword: voidVerbphrase
        weight:
        zh: 卷曲成令人不安的形状
      - keyword: voidVerbphrase
        weight:
        zh: 扭曲起来，仿佛试图去伤害周围的人
      - keyword: voidVerbphrase
        weight:
        zh: 似乎在注视下发生了变化
      - keyword: voidVerbphrase
        weight:
        zh: 散发出一丝愤怒
      - keyword: voidVerbphrase
        weight:
        zh: 散发出一丝悲哀与绝望
      - keyword: voidVerbphrase
        weight:
        zh: 引发了人们的恐惧和自我怀疑
      - keyword: voidVerbphrase
        weight:
        zh: 随机地向不同方向延展
      - keyword: voidVerbphrase
        weight:
        zh: 似乎在颤抖，直视它才会停止
      - keyword: voidVerbphrase
        weight:
        zh: 仿佛像在呼吸一般
      - keyword: voidVerbphrase
        weight:
        zh: 不像任何生物
      - keyword: voidVerbphrase
        weight:
        zh: 似乎是痛苦的隐喻
      voidDesc:
      - keyword: voidDesc
        weight:
        zh: 数十根手指般的附肢痛苦地抓着中间的图案。
      - keyword: voidDesc
        weight:
        zh: 球状材料相互挤压，形成拉伸的形状。
      - keyword: voidDesc
        weight:
        zh: 利刃般的部件弯曲交缠，就像一张惊恐尖叫的脸。
      - keyword: voidDesc
        weight:
        zh: 手臂一样的突起物相互挤压，似乎想要摧毁自己。
      - keyword: voidDesc
        weight:
        zh: 从表面伸出的针刺看起来随时准备射出，将附近移动的任何人扎个对穿。
      - keyword: voidDesc
        weight:
        zh: 表面呈现出旋涡状和卷曲状，从有机物般的纹理转变为机器般锋利的边缘。
      - keyword: voidDesc
        weight:
        zh: 它看起来就像被巨大的力量撕成了碎片，但不知何故，它仍然藕断丝连。
      - keyword: voidDesc
        weight:
        zh: 一只手状的附着物等待着，似乎随时准备开始攻击。
      - keyword: voidDesc
        weight:
        zh: 一对图案似乎都在用弯曲、锯齿状的手指穿透并折磨着对方。
      - keyword: voidDesc
        weight:
        zh: 一张尖叫的脸上浮现出一个复杂的形状。
      - keyword: voidDesc
        weight:
        zh: 类似动物的抽象图案似乎要扯下自己的一条肢体。
      - keyword: voidDesc
        weight:
        zh: 在扭曲的大球上，成百上千个抽象的小图案蜂拥而至。
    ruleCount: 32
