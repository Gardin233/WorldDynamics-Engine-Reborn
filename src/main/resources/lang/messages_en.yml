ideology_meme_original_sin_name: 'Original Sin'
ideology_meme_original_sin_description: 'Human nature is seen as inherently flawed, and desire must be restrained through discipline, repentance, and order.'
ideology_meme_nature_primacy_name: 'Nature Primacy'
ideology_meme_nature_primacy_description: 'Civilization should not stand above nature; the closer one lives to wilderness, instinct, and season, the truer life becomes.'
ideology_meme_proselytizer_name: 'Proselytizer'
ideology_meme_proselytizer_description: 'Belief is meant to spread outward. Persuading others and enlarging the community is treated as a near-sacred duty.'
ideology_meme_loyalty_name: 'Loyalty'
ideology_meme_loyalty_description: 'Loyalty is treated as the highest virtue, and betrayal is considered worse than defeat.'
ideology_meme_supremacist_name: 'Supremacist'
ideology_meme_supremacist_description: 'The strong are believed to have the right to dominate the weak, and conquest is framed as a legitimate way to impose order.'
ideology_meme_collectivist_name: 'Collectivist'
ideology_meme_collectivist_description: 'The individual is only one part of the whole, and labor, resources, and honor should serve collective survival first.'
ideology_meme_ritualist_name: 'Ritualist'
ideology_meme_ritualist_description: 'Repeated ceremony is believed to shape identity and conviction, so public ritual becomes essential to communal life.'
ideology_meme_darkness_name: 'Darkness'
ideology_meme_darkness_description: 'Darkness is treated not as fear but as shelter, comfort, and a fitting environment for life.'
ideology_meme_tunneler_name: 'Tunneler'
ideology_meme_tunneler_description: 'Underground living is prized for its safety and permanence, with stone and depth valued above exposed surface life.'
ideology_meme_cannibal_name: 'Cannibal'
ideology_meme_cannibal_description: 'Consuming human flesh is framed as part of power, victory, or ritual, deliberately breaking ordinary moral taboo.'
ideology_meme_bloodfeeder_name: 'Bloodfeeder'
ideology_meme_bloodfeeder_description: 'Blood is revered as a symbol of life and power, and blood rites are approached with obsessive intensity.'
ideology_meme_pain_is_virtue_name: 'Pain Is Virtue'
ideology_meme_pain_is_virtue_description: 'Pain is believed to refine the will, and enduring suffering is treated as proof of worth and strength.'
ideology_meme_nudist_name: 'Nudist'
ideology_meme_nudist_description: 'The body should not be hidden in shame; clothing is seen as constraint and concealment rather than necessity.'
ideology_meme_nonhuman_alienation_name: 'Nonhuman Alienation'
ideology_meme_nonhuman_alienation_description: 'Traditional human identity is rejected in favor of mutation, mechanization, and becoming something fundamentally other.'
ideology_meme_raider_name: 'Raider'
ideology_meme_raider_description: 'Raiding and plunder are accepted as natural paths to survival, wealth, and prestige.'
ideology_meme_individualist_name: 'Individualist'
ideology_meme_individualist_description: 'Personal choice and private boundaries come before collective demand, and no group should fully absorb the self.'
ideology_meme_animal_personhood_name: 'Animal Personhood'
ideology_meme_animal_personhood_description: 'Animals are not mere tools or resources, but living beings deserving moral regard closer to that given to humans.'
ideology_meme_human_primacy_name: 'Human Primacy'
ideology_meme_human_primacy_description: 'Humanity is the moral center of the universe.'
